services:
  api:
    build: .
    image: nua-back-image
    container_name: nua-back-api
    tty: true

    environment:
      # The database host is only reachable as "db" inside the compose network,
      # so DATABASE_URL is assembled here instead of taken from .env.
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-nua}:${POSTGRES_PASSWORD:-nua}@db:5432/${POSTGRES_DB:-nua}"
      HOST: "${HOST:-0.0.0.0}"
      PORT: "${PORT:-8000}"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
      LOG_FILE: "${LOG_FILE:-latest.log}"

    ports:
      - "${PORT:-8000}:${PORT:-8000}"

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    container_name: nua-back-db

    environment:
      POSTGRES_USER: "${POSTGRES_USER:-nua}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-nua}"
      POSTGRES_DB: "${POSTGRES_DB:-nua}"

    volumes:
      - nua-db-data:/var/lib/postgresql/data

    ports:
      - 5432:5432

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nua}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nua-db-data:
